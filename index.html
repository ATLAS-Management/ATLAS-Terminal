<!DOCTYPE html>
<html>

<head>
    <title>ATLAS Terminal</title>

    <style>

        body {
            background-color: black;
            color: #00ff66;
            font-family: monospace;
            padding: 20px;
            margin: 0;
        }

        #header {
            border-bottom: 1px solid #00ff66;
            padding-bottom: 10px;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        #output {
            min-height: 300px;
            white-space: pre-wrap;
            margin-bottom: 20px;
        }

        #input-area {
            display: flex;
            align-items: center;
        }

        input {
            background: black;
            border: none;
            color: #00ff66;
            font-family: monospace;
            outline: none;
            width: 100%;
            font-size: 16px;
        }

    </style>
</head>

<body>

<div id="header">
ATLAS INTERNAL NETWORK v1.0
AUTHORIZED PERSONNEL ONLY

Type "help" for available commands.
</div>

<div id="output">
SYSTEM READY
</div>

<div id="input-area">
    >
    <input type="text" id="commandInput" autofocus>
</div>

<script>

const input = document.getElementById("commandInput");
const output = document.getElementById("output");

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        const command = input.value.trim().toLowerCase();

        if (command === "help") {

            output.innerHTML =
`AVAILABLE COMMANDS

help
dir
open personnel.txt
open incident.txt
clear`;

        }

        else if (command === "dir") {

            output.innerHTML =
`DIRECTORIES

personnel.txt
incident.txt`;

        }

        else if (command === "open personnel.txt") {

            output.innerHTML =
`PERSONNEL FILE

Name: Dr. Evelyn Ward
Role: Acting Site Director
Clearance: Level 4`;

        }

        else if (command === "open incident.txt") {

            output.innerHTML =
`INCIDENT REPORT

Designation: INC-042
Site: Blacksite-12
Security Status: LOCKDOWN`;

        }

        else if (command === "clear") {

            output.innerHTML = "";

        }

        else if (command === "") {

            output.innerHTML =
`NO COMMAND ENTERED`;

        }

        else {

            output.innerHTML =
`UNKNOWN COMMAND

Type "help" for available commands.`;

        }

        input.value = "";

    }

});

</script>

</body>
</html>
